<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pathfinding Visualizer</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <div class="title-section">
      <h1>Pathfinding Visualizer</h1>
      <p>Drag Start (Green) & End (Red) | Click to Draw</p>
    </div>

    <div class="controls-section">
      <div class="tools">
        <label class="radio-label">
          <input type="radio" id="drawWall" name="drawMode" value="wall" checked onchange="updateDrawMode(this.value)">
          Walls
        </label>
        
        <label class="radio-label">
          <input type="radio" id="drawWeight" name="drawMode" value="weight" onchange="updateDrawMode(this.value)">
          Weights: 
          <input type="number" id="weightValue" class="num-input" value="5" min="2" max="99">
        </label>
      </div>

      <div class="grid-sizing">
        <label>R:</label>
        <input type="number" id="rowsInput" class="num-input" value="20" min="5" max="100">
        <label>C:</label>
        <input type="number" id="colsInput" class="num-input" value="50" min="5" max="100">
        <button class="btn secondary" onclick="applyGridSize()">Set Grid</button>
      </div>
    </div>

    <div class="actions-section">
      <button class="btn run" onclick="visualizeDijkstra()">Dijkstra</button>
      <button class="btn run" onclick="visualizeBFS()">BFS</button>
      <button class="btn run" onclick="visualizeDFS()">DFS</button>
      <button class="btn run" onclick="visualizeBellmanFord()">Bellman-Ford</button>
      <button class="btn run" onclick="visualizeFloydWarshall()">Floyd-Warshall</button>
    </div>

    <div class="reset-section">
      <button class="btn outline" onclick="clearPath()">Clear Path</button>
      <button class="btn outline" onclick="clearWalls()">Reset Grid</button>
      <button class="btn outline" onclick="generateRandomMaze()">Random Maze</button>
      <button class="btn outline" onclick="animatePrimsMaze()">Prim's Maze</button>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar">Ready</div>
    </div>
  </header>

  <main>
    <div id="grid"></div>
  </main>
  
  <script type="module" src="script.js"></script>
</body>
</html>
